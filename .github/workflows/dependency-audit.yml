name: Dependency audit

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  audit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: ruby/setup-ruby@651ff0d62c5c79bed6d53ec518387aae20e72c1a # v1
        with:
          ruby-version: "3.4"
      - name: Install advisory scanner
        run: gem install bundler-audit --version 0.9.3 --no-document
      - name: Update advisory database
        run: bundle-audit update
      - name: Audit every lockfile
        shell: bash
        run: |
          audit_status=0
          while IFS= read -r -d '' lockfile; do
            echo "==> ${lockfile}"
            bundle-audit check --no-update --gemfile-lock "${lockfile}" || audit_status=1
          done < <(find . -name Gemfile.lock -print0)
          exit "${audit_status}"

